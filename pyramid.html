    <script>
    //     1
    //    212
    //   32123
    //  4321234
    // 543212345
        for(let j=1;j<=5;j++){
            for(let s=5;s>j;s--){
                document.write("&nbsp;&nbsp;")
            }
            for(let i=j;i>=1;i--){
                document.write(i)
            }
            for(let k=2;k<=j;k++){
                document.write(k)
            }
            document.write("</br>")
        }
    </script>
